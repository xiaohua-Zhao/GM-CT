server:
  port: 8080

spring:
  application:
    name: chengtai-fashion-mgmt
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ct_gm?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  sql:
    init:
      mode: never

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  config: classpath:logback-spring.xml

file:
  attachment:
    root: ${ATTACHMENT_ROOT:./attachments}
    max-size: 20971520


app:
  jwt:
    secret: ${JWT_SECRET:chengtai-fashion-mgmt-jwt-secret-2026-local-dev-only}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
    issuer: ${JWT_ISSUER:chengtai-fashion-mgmt}
    header-name: Authorization
    token-prefix: "Bearer "
  auth:
    login-log-enabled: ${AUTH_LOGIN_LOG_ENABLED:true}
    access-log-enabled: ${AUTH_ACCESS_LOG_ENABLED:false}
    token-debug-enabled: ${AUTH_TOKEN_DEBUG_ENABLED:true}
    log-retention-days: ${AUTH_LOG_RETENTION_DAYS:90}
    log-cleanup-cron: ${AUTH_LOG_CLEANUP_CRON:0 0 3 * * ?}
  api-log:
    enabled: ${API_LOG_ENABLED:true}
    include-response: ${API_LOG_INCLUDE_RESPONSE:true}
    max-payload-length: ${API_LOG_MAX_PAYLOAD_LENGTH:8000}
    slow-threshold-ms: ${API_LOG_SLOW_THRESHOLD_MS:1000}
    excluded-paths:
      - /api/health
      - /actuator

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
